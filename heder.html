<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi página - Mobile Legends</title>

    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
        rel="stylesheet">

    <style>
        :root {
            --colo-1: #9DB1CB;
            --color-2: #2739B7; 
            --color-3: #000000; 
            --color-4: #FFDA13; 
            --color-5: #282A5B; 
        }
        .custom-navbar {
            background-color: var(--color-5) !important;
            border-bottom: 2px solid var(--color-4);
            padding: 0.8rem 0;
        }

        .header-title {
            color: var(--color-1) !important;
            font-weight: 500;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 0;
        }
        .center-brand {
            color: var(--color-4) !important;
            font-size: 1.6rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.4);
            margin: 0;
            text-decoration: none;
        }

        .center-brand:hover {
            color: #ffffff !important;
        }

        .btn-custom {
            background-color: var(--color-3) !important;
            color: var(--color-4) !important;
            border: 2px solid var(--color-4) !important;
            font-weight: 600;
            padding: 0.4rem 1.2rem;
            border-radius: 20px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
        }

        .btn-custom:hover {
            background-color: var(--color-4) !important;
            color: var(--color-3) !important;
            box-shadow: 0 0 10px rgba(255, 218, 19, 0.5);
            transform: translateY(-2px);
        }

        .custom-navbar .navbar-toggler {
            border-color: var(--color-4);
        }
        
        .custom-navbar .navbar-toggler-icon {
            filter: invert(85%) sepia(80%) saturate(1000%) hue-rotate(355deg);
        }

        @media (max-width: 991px) {
            .center-brand {
                font-size: 1.3rem;
                margin: 10px 0;
            }
            .navbar-collapse {
                margin-top: 15px;
            }
        }
    </style>
</head>

<body>

    <header>
        <nav class="navbar navbar-expand-lg custom-navbar">
            <div class="container">

                <a class="navbar-brand d-flex align-items-center me-0" href="#">
                    <img  
                        src="logo/mobile_legends.png"  
                        alt="Logo Mobile Legends"  
                        class="me-2"
                        width="65" 
                        height="65"
                        style="object-fit: contain;"
                    >
                </a>

                <div class="mx-auto text-center">
                    <a href="#" class="center-brand">Mobile Legends</a>
                </div>

                <button 
                    class="navbar-toggler" 
                    type="button" 
                    data-bs-toggle="collapse" 
                    data-bs-target="#menu"
                    aria-controls="menu"
                    aria-expanded="false"
                    aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse flex-grow-0" id="menu">
                    <ul class="navbar-nav ms-auto align-items-center pt-2 pt-lg-0">
                        <li class="nav-item">
                            <a class="btn btn-custom nav-link px-3" href="#">Imágenes</a>
                        </li>
                    </ul>
                </div>

            </div>
        </nav>
    </header>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
